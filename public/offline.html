<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Mix Studio is offline</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #000; color: #f7f7fb; }
    main { width: min(420px, 100%); text-align: center; }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { margin: 24px 0 8px; font-size: 28px; }
    p { margin: 0; color: #9aa3b8; line-height: 1.55; }
    button { margin-top: 24px; min-height: 48px; padding: 0 24px; border: 1px solid #3b82f6; border-radius: 999px; background: #10131d; color: #fff; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/app-icon-192.png" alt="" />
    <h1>Mix Studio is offline</h1>
    <p>Make sure the generation computer is running and this device is connected to the same network or Tailscale.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
